# 조회 서버(app 컨테이너)로 전달. 원래 주소(Host, 포트 포함)와 http/https 여부를 넘겨
# 구글 로그인 콜백 주소 등을 접속한 주소 그대로 만들게 한다
client_max_body_size 5m;

# app 컨테이너를 다시 만들면 내부 주소가 바뀔 수 있으므로, 시작할 때 한 번이 아니라
# 도커 내부 DNS(127.0.0.11)로 요청 때마다(10초 캐시) 주소를 찾는다. 변수로 넘겨야 다시 찾는다
resolver 127.0.0.11 valid=10s ipv6=off;
set $app_upstream http://app:8765;

location / {
    proxy_pass $app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
}
