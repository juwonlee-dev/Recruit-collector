# HTTP (컨테이너 80 = PC 8765 = 공유기 외부 80)
# - Let's Encrypt 발급·갱신 확인 파일(/.well-known/acme-challenge/)은 어느 주소로 와도 응답
# - 인증서가 생기면 https.conf가 켜져 서비스 도메인은 https로 보낸다. 그 밖의 주소(예전 주소 등)는 그대로 조회 서버로 전달
server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/proxy_app.conf;
}
