[project]
name = "recruit-collector"
version = "0.1.0"
description = "채용 사이트 공고 목록을 주기적으로 크롤링해 적재하는 수집기 (개인·비상업용)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "itsdangerous>=2.1",  # 구글 로그인 요청 확인값 쿠키 서명
    "PyJWT>=2.8",  # 로그인 Access·Refresh 토큰 (web/tokens.py)
    "psycopg[binary]>=3.2",  # PostgreSQL 드라이버 (database_url: postgresql+psycopg://...)
    "weasyprint>=66",  # 이력서 PDF (도커 이미지에 Pango·한글 글꼴을 함께 설치, web/resumes.py render_pdf)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recruit-collector = "recruit_collector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recruit_collector*"]

[tool.setuptools.package-data]
"recruit_collector.web" = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
