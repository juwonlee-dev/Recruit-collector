# 리멤버 검색 필터. 수집을 시작할 때 읽어 메모리에 올려 쓰므로, 바꾼 내용은 다음 수집부터 반영된다.
# 직무 필드(job_categories)와 지역 필드(addresses)는 설정 화면의 '필터 생성'으로 키워드·지역에서 다시 만들 수 있다 (다른 값은 유지).
# 조건 키는 recruit_collector/crawlers/remember.py 의 검색 조건(Condition) 클래스 참고.
# name은 삭제 판정 단위이므로 바꾸지 않는 것이 좋다. generated는 마지막 필터 생성 기록 (수집에는 쓰지 않음).
