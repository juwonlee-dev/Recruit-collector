# 공통 지역코드. 설정 > 검색 필터의 지역 선택지이며, 사이트마다 다른 지역 코드를 이 코드에 맞춰 매핑한다.
# 코드는 '시도' 또는 '시도 시군구' (예: 서울, 경기 안양시). 구가 있는 시는 시 단위로 묶는다 (안양시 = 동안구 + 만안구).
# 사이트별 지역 선택지(config/catalog/<사이트>_regions.json)와는 시도·시군구 이름으로 맞춘다 (recruit_collector/regions.py).
# 광주와 전남은 사람인·잡코리아처럼 전남광주로 묶는다 (원티드·리멤버는 광주·전남 두 곳으로 매핑).
# 행정구역은 현재 이름을 쓴다 (2026.7 인천 개편, 2023.7 군위군 대구 편입). 옛 이름만 있는 사이트는 region_names.py의 OLD_NAMES로 매핑.
