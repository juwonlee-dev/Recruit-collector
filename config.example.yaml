# 복사해서 config.yaml 로 사용하세요.

database_url: sqlite:///data/recruit.db   # PostgreSQL 예: postgresql+psycopg://user:pw@localhost/recruit (도커에서는 환경 변수 DATABASE_URL이 우선)

schedule:
  # 자동 수집은 조회 화면의 설정 > 스케줄러 탭에서 시작·중지하고 주기를 바꿉니다 (DB에 저장).
  # 아래 cron은 설정 화면에서 주기를 정하기 전의 처음 주기입니다. 실제 수집은 수집기(worker)가 합니다.
  # 분 시 일 월 요일. 사이트별 병렬 수집으로 1회 약 6분 소요 (잡코리아 약 115페이지가 가장 오래 걸림)
  # 이전 수집이 끝나지 않았으면 다음 회차는 건너뜀
  cron: "0 * * * *"        # 매시 정각
  timezone: Asia/Seoul

sync:
  # 연속 N회 수집에서 보이지 않아야 삭제(DELETED)로 처리.
  # 수집 중 페이지 밀림으로 일시적으로 누락되는 공고를 오삭제하지 않기 위함.
  missing_threshold: 2

http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
  delay_seconds: [2, 4]    # 요청 사이 무작위 지연(초)
  timeout: 20
  max_retries: 3
  respect_robots: true

# 설정 파일 위치 (이 파일 기준 상대 경로)
paths:
  # 사이트(크롤러 모듈)별 검색 필터 파일 폴더. <사이트>.yaml 하나가 그 사이트의 검색 조건 목록이다.
  # 수집을 시작할 때마다 새로 읽으므로 서버·스케줄러를 다시 띄우지 않아도 다음 수집부터 반영된다.
  searches_dir: config/searches
  # 필터 생성에 쓰는 키워드 (조회 화면의 설정 메뉴에서 등록·삭제)
  keywords_file: config/keywords.yaml
  # 필터 생성에 쓰는 지역 (조회 화면의 설정 메뉴에서 등록·삭제)
  regions_file: config/regions.yaml
  # 공통 지역코드: 지역 선택지이자 사이트별 지역 코드와 매핑하는 기준
  region_codes_file: config/region_codes.yaml
  # 필터 생성용 매핑 데이터: 사이트별 직무·지역 선택지 (python -m recruit_collector build-catalog 로 갱신)
  catalog_dir: config/catalog

# 구글 로그인 (선택). 로그인 사용 여부는 조회 화면의 설정 > 사용자 관리에서 켜고 끕니다.
# 로그인을 켜면 '지금 수집'과 설정 메뉴는 관리자만 쓸 수 있습니다. 회원가입은 따로 없고 첫 로그인 때 자동 가입됩니다.
# 구글 클라우드 콘솔 > API 및 서비스 > 사용자 인증 정보 > OAuth 클라이언트 ID(웹 애플리케이션)를 만들고,
# 승인된 리디렉션 URI에 <접속 주소>/auth/callback 을 등록하세요 (예: https://example.com/auth/callback).
# 구글 정책상 리디렉션 URI는 https 도메인이어야 하며, http는 localhost만 허용됩니다 (IP 주소 불가).
auth:
  google_client_id: ""
  google_client_secret: ""
  # 항상 관리자인 구글 이메일 (설정 화면에서 등급을 바꿀 수 없음). 다른 사용자는 설정 화면에서 관리자로 지정할 수 있습니다.
  admin_emails:
    - juwonlee.dev@gmail.com
